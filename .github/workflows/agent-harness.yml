# V4 harness checks that run without any agent: policy/mirror consistency, hook unit
# tests and tracked-secret detection. Add your project's own test job next to this one.
name: agent-harness

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Harness configuration
        run: python3 -B agent-core/scripts/check_agent_config.py
      - name: Harness unit tests
        run: python3 -B -m unittest discover -s agent-core/tests
      - name: Tracked secrets
        run: python3 -B agent-core/scripts/doctor.py --repo-only --strict
